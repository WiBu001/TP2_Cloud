<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merch Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2f3640;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f1f2f6;
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
        }

        input {
            padding: 10px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #0984e3;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #74b9ff;
        }
    </style>
</head>
<body>

<header>
    <h1 id="judul">Memuat...</h1>
    <p id="owner"></p>
</header>

<div class="container">
    <div class="card">
        <h2>📦 Daftar Merchandise</h2>
        <ul id="menu-list"></ul>
    </div>

    <div class="card" style="margin-top:20px;">
        <h3>➕ Tambah Item</h3>
        <input type="text" id="menu-input" placeholder="Nama merchandise...">
        <button onclick="tambahMenu()">Tambah</button>
    </div>
</div>

<script>
    const API_URL = '/api';

    function loadData() {
        fetch(`${API_URL}/info`)
            .then(res => res.json())
            .then(data => {
                // ⚠️ SESUAIKAN DENGAN BACKEND KAMU
                document.getElementById('judul').innerText = data.judul_katalog;
                document.getElementById('owner').innerText =
                    `Owner: ${data.pemilik} | NIM: ${data.nim}`;

                const list = document.getElementById('menu-list');
                list.innerHTML = '';

                data.items.forEach(item => {
                    let li = document.createElement('li');
                    li.innerText = item;
                    list.appendChild(li);
                });
            });
    }

    function tambahMenu() {
        const input = document.getElementById('menu-input');

        fetch(`${API_URL}/add-item`, {   // ⚠️ endpoint backend kamu
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item: input.value })
        })
        .then(res => res.json())
        .then(() => {
            input.value = '';
            loadData();
        });
    }

    loadData();
</script>

</body>
</html>
